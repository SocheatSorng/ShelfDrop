version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date (Dependabot updates the
  # SHA and the "# vX.Y.Z" comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Dev tools only (ESLint, Prettier). The Apps Script itself ships no npm packages.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]
